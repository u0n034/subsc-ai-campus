<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML構造の図解</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
            background-color: #f5f5f5;
        }
        
        .title {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
        }
        
        .structure-box {
            background: white;
            border: 3px solid #2563eb;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }
        
        .tag-label {
            font-family: 'Courier New', monospace;
            background: #2563eb;
            color: white;
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 14px;
            display: inline-block;
            margin-bottom: 10px;
        }
        
        .section-box {
            border: 2px solid #2563eb;
            padding: 15px;
            border-radius: 6px;
            background: #eff6ff;
        }
        
        .h2-box {
            background: #dbeafe;
            border: 2px solid #3b82f6;
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 15px;
        }
        
        .item-box {
            background: white;
            border: 2px solid #10b981;
            border-radius: 4px;
            padding: 15px;
            margin-bottom: 12px;
        }
        
        .h3-box {
            background: #d1fae5;
            border: 1px solid #10b981;
            padding: 8px;
            border-radius: 3px;
            margin-bottom: 8px;
        }
        
        .p-box {
            background: #f0fdf4;
            border: 1px solid #86efac;
            padding: 8px;
            border-radius: 3px;
            margin-bottom: 6px;
        }
        
        .tag-name {
            font-weight: bold;
            color: #dc2626;
        }
        
        .content-text {
            color: #374151;
            margin-left: 10px;
        }
    </style>
</head>
<body>
    <h1 class="title">AIが生成した構造のイメージ</h1>
    
    <div class="structure-box">
        <div class="section-box">
            <span class="tag-label">&lt;section id="media"&gt;</span>
            
            <div class="h2-box">
                <span class="tag-name">&lt;h2&gt;</span>
                <span class="content-text">メディア掲載実績</span>
                <span class="tag-name">&lt;/h2&gt;</span>
            </div>
            
            <div class="item-box">
                <span class="tag-label" style="background: #10b981;">&lt;div&gt;</span>
                <div style="margin-top: 10px;">
                    <div class="h3-box">
                        <span class="tag-name">&lt;h3&gt;</span>
                        <span class="content-text">メディア名</span>
                        <span class="tag-name">&lt;/h3&gt;</span>
                    </div>
                    <div class="p-box">
                        <span class="tag-name">&lt;p&gt;</span>
                        <span class="content-text">掲載日</span>
                        <span class="tag-name">&lt;/p&gt;</span>
                    </div>
                    <div class="p-box">
                        <span class="tag-name">&lt;p&gt;</span>
                        <span class="content-text">記事タイトル</span>
                        <span class="tag-name">&lt;/p&gt;</span>
                    </div>
                </div>
                <span class="tag-label" style="background: #10b981;">&lt;/div&gt;</span>
            </div>
            
            <div class="item-box">
                <span class="tag-label" style="background: #10b981;">&lt;div&gt;</span>
                <div style="margin-top: 10px;">
                    <div class="h3-box">
                        <span class="tag-name">&lt;h3&gt;</span>
                        <span class="content-text">メディア名</span>
                        <span class="tag-name">&lt;/h3&gt;</span>
                    </div>
                    <div class="p-box">
                        <span class="tag-name">&lt;p&gt;</span>
                        <span class="content-text">掲載日</span>
                        <span class="tag-name">&lt;/p&gt;</span>
                    </div>
                    <div class="p-box">
                        <span class="tag-name">&lt;p&gt;</span>
                        <span class="content-text">記事タイトル</span>
                        <span class="tag-name">&lt;/p&gt;</span>
                    </div>
                </div>
                <span class="tag-label" style="background: #10b981;">&lt;/div&gt;</span>
            </div>
            
            <div class="item-box">
                <span class="tag-label" style="background: #10b981;">&lt;div&gt;</span>
                <div style="margin-top: 10px;">
                    <div class="h3-box">
                        <span class="tag-name">&lt;h3&gt;</span>
                        <span class="content-text">メディア名</span>
                        <span class="tag-name">&lt;/h3&gt;</span>
                    </div>
                    <div class="p-box">
                        <span class="tag-name">&lt;p&gt;</span>
                        <span class="content-text">掲載日</span>
                        <span class="tag-name">&lt;/p&gt;</span>
                    </div>
                    <div class="p-box">
                        <span class="tag-name">&lt;p&gt;</span>
                        <span class="content-text">記事タイトル</span>
                        <span class="tag-name">&lt;/p&gt;</span>
                    </div>
                </div>
                <span class="tag-label" style="background: #10b981;">&lt;/div&gt;</span>
            </div>
            
            <span class="tag-label">&lt;/section&gt;</span>
        </div>
    </div>
    
</body>
</html>
